# KHassk dir image name 
services:

  nginx:
    build:  ./requirements/nginx
    image: nginx-inception
    ports:
      - "443:443"
    networks:
      - inception
    restart: always
    depends_on:
      - wordpress

  wordpress:
    build: ./requirements/WordPress
    image: wordpress-inception
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    # I need to just put the file of env give me another way to do this 
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: ${DB_HOST}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      
    restart: always
    depends_on:
      - mariadb

  mariadb:
    build: ./requirements/MariaDB
    image: mariadb-inception
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    restart: always

networks:
  inception:

# need to do a bind month for these volumes 
volumes:
  mariadb_data:
  wordpress_data:


