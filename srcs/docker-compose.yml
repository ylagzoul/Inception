
services:

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx-inception
    ports:
      - "443:443"
    networks:
      - inception
    restart: always
    depends_on:
      - wordpress

  wordpress:
    build:
      context: ./requirements/WordPress
    image: wordpress-inception
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: ${DB_HOST}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    secrets:
      - db_password
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    build:
      context: ./requirements/MariaDB
    image: mariadb-inception
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_password
      - db_root_password
    restart: always
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

networks:
  inception:

volumes:
  mariadb_data:
  wordpress_data:

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt
